<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-weight="400" fill="#1e1e1e" height="900" viewBox="0 0 900 900" width="100%" xmlns="http://www.w3.org/2000/svg">

